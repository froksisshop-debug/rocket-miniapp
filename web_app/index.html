<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>🚀 Ракета</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="app" id="app">
  <!-- header -->
  <div class="header">
    <div class="balance" id="balance">0 ⭐</div>
    <div class="history" id="history-dots"></div>
  </div>

  <!-- skin selector -->
  <div class="skin-bar" id="skin-bar"></div>

  <!-- game canvas -->
  <div class="game-box">
    <canvas id="canvas"></canvas>
    <img class="rocket-overlay" id="rocket-overlay" alt="" draggable="false">
    <div class="mult-overlay">
      <div class="mult" id="mult-display">1.00x</div>
      <div class="label" id="mult-label">Place your bet</div>
    </div>
  </div>

  <!-- bet controls -->
  <div class="bet-panel">
    <input type="number" id="bet-input" placeholder="Bet (Stars)" min="1" max="500" value="10">
  </div>
  <div class="bet-presets" id="bet-presets">
    <button type="button" onclick="setBet(5)">5</button>
    <button type="button" onclick="setBet(10)">10</button>
    <button type="button" onclick="setBet(25)">25</button>
    <button type="button" onclick="setBet(50)">50</button>
    <button type="button" onclick="setBet(100)">100</button>
    <button type="button" onclick="setBet(250)">250</button>
  </div>

  <!-- action button -->
  <button type="button" class="btn btn-bet" id="action-btn" onclick="onAction()">BET</button>

  <!-- status -->
  <div class="status-bar">
    <span><span class="dot on" id="status-dot"></span><span id="status-text">Connected</span></span>
    <span id="min-bet-text">Min: 1 ⭐</span>
  </div>

  <!-- recent history -->
  <div class="history-list">
    <h3>Recent Flights</h3>
    <div id="recent-list"></div>
  </div>

  <!-- bottom nav -->
  <div class="nav">
    <button type="button" onclick="TG.close()">Close</button>
  </div>
</div>

<!-- topup popup -->
<div class="popup-overlay" id="topup-popup">
  <div class="popup">
    <h2>Not enough Stars</h2>
    <p id="topup-msg">You need more Stars to place this bet.</p>
    <button type="button" class="btn btn-bet" onclick="topupStars()">Top up Stars</button>
    <button type="button" class="btn" onclick="closeTopup()">Cancel</button>
  </div>
</div>

<!-- Официальная библиотека Telegram. Единственный внешний скрипт, без неё нет window.Telegram.WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
